<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olfato House — Catalogue de Parfums</title>
  <meta name="description"
    content="Olfato House - The Art of Perfume. Découvrez notre collection exclusive de parfums pour homme, femme et unisex.">
  <link rel="icon" href="site/assets/logo.png" type="image/png">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="site/style.css">
</head>

<body>
  <!-- HEADER -->
  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo-link">
        <img src="site/assets/logo.png" alt="Olfato House" class="logo" id="main-logo">
      </a>
      <nav id="main-nav">
        <a href="#" class="nav-link active" data-filter="all">Tous</a>
        <a href="#" class="nav-link" data-filter="Homme">Homme</a>
        <a href="#" class="nav-link" data-filter="Femme">Femme</a>
        <a href="#" class="nav-link" data-filter="Unisex">Unisex</a>
      </nav>
      <div class="search-container" id="search-container">
        <input type="text" id="search-input" placeholder="Rechercher un parfum..." autocomplete="off">
        <svg id="header-search-btn" class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="cursor:pointer; pointer-events:auto; z-index:10;">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <svg id="header-clear-btn" class="clear-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="cursor:pointer; position:absolute; right:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--color-text-dim); z-index:10;">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        <div id="search-dropdown" class="search-dropdown hidden"></div>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section id="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <img src="site/assets/logo.png" alt="Olfato House" class="hero-logo">
      <p class="hero-subtitle">L'Art du Parfum</p>
      <div class="hero-search">
        <input type="text" id="hero-search-input" placeholder="Rechercher par nom, marque ou accord..."
          autocomplete="off">
        <button id="hero-search-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
        <svg id="hero-clear-btn" class="clear-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="cursor:pointer; position:absolute; right:60px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--color-text-dim); z-index:10;">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        <div id="hero-search-dropdown" class="search-dropdown hidden"></div>
      </div>
      <div class="hero-categories">
        <button class="cat-btn" data-filter="Homme">
          <span class="cat-icon">♂</span>
          <span>Homme</span>
        </button>
        <button class="cat-btn" data-filter="Femme">
          <span class="cat-icon">♀</span>
          <span>Femme</span>
        </button>
        <button class="cat-btn" data-filter="Unisex">
          <span class="cat-icon">⚤</span>
          <span>Unisex</span>
        </button>
      </div>
    </div>
    <div class="hero-scroll-indicator">
      <span>Découvrir</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </div>
  </section>

  <!-- CATALOG -->
  <section id="catalog">
    <div class="catalog-header">
      <h1 id="catalog-title">Notre Collection</h1>
      <span id="product-count" class="product-count"></span>
    </div>
    <div id="product-grid" class="product-grid"></div>
    <div id="load-more-container" class="load-more-container">
      <button id="load-more-btn" class="load-more-btn">Voir plus</button>
    </div>
  </section>

  <!-- PRODUCT MODAL -->
  <div id="product-modal" class="modal hidden">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content" id="modal-content">
      <button class="modal-close" id="modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="footer">
    <div class="footer-inner">
      <img src="site/assets/logo.png" alt="Olfato House" class="footer-logo">
      <nav class="footer-social" aria-label="Reseaux sociaux">
        <a class="social-link" href="https://www.instagram.com/lartiste.parfum/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.2" cy="6.8" r="1"></circle>
          </svg>
        </a>
        <a class="social-link" href="https://www.facebook.com/profile.php?id=61574354267771" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
          <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14.5 3H11a3 3 0 0 0-3 3v3H5v4h3v8h4v-8h3l1-4h-4V7c0-.6.4-1 1-1h3V3z"></path>
          </svg>
        </a>
        <a class="social-link" href="https://www.pinterest.com/LartisteParfum/?actingBusinessId=1099722940167370745" target="_blank" rel="noopener noreferrer" aria-label="Pinterest" title="Pinterest">
          <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
            <text x="12" y="16" text-anchor="middle" font-size="13" font-family="Inter, sans-serif" font-weight="700">P</text>
          </svg>
        </a>
        <a class="social-link" href="https://www.tiktok.com/@lartiste_parfum?lang=en" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 4v9a3.5 3.5 0 1 1-2.5-3.3"></path>
            <path d="M13 5c1 .9 2.2 1.4 3.5 1.5"></path>
          </svg>
        </a>
      </nav>
      <p class="footer-text">© 2026 Olfato House — The Art of Perfume</p>
    </div>
  </footer>

  <script src="site/app.js?v=18"></script>
</body>

</html>
